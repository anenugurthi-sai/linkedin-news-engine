name: AI News LinkedIn Engine

on:
  schedule:
    - cron: '0 2 * * *' # Runs automatically every day at 7:30 AM IST
  workflow_dispatch: # Allows you to trigger it manually anytime with a single click

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Necessary Connectors
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Execute Smart Scraper and Push to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python -c '
          import os
          import requests
          import feedparser

          NOTION_TOKEN = os.environ.get("NOTION_TOKEN")
          DATABASE_ID = os.environ.get("NOTION_DATABASE_ID")

          FEEDS = [
            "https://news.google.com/rss/search?q=Salesforce+AI+Agentforce&hl=en-IN&gl=IN&ceid=IN:en",
            "https://news.google.com/rss/search?q=ChatGPT+Gemini+Anthropic+LLM+update&hl=en-IN&gl=IN&ceid=IN:en",
            "https://news.google.com/rss/search?q=no-code+AI+productivity+automation+workflow&hl=en-IN&gl=IN&ceid=IN:en"
          ]

          headers = {
              "Authorization": f"Bearer {NOTION_TOKEN}",
              "Content-Type": "application/json",
              "Notion-Version": "2022-06-28"
          }

          print("Starting global AI feed analysis...")
          seen_titles = set()
          count = 0

          for url in FEEDS:
              feed = feedparser.parse(url)
              for entry in feed.entries[:5]:
                  title = entry.get("title", "")
                  link = entry.get("link", "")
                  
                  if title in seen_titles:
                      continue
                  seen_titles.add(title)
                  clean_title = title.split(" - ")[0]

                  payload = {
                      "parent": { "database_id": DATABASE_ID },
                      "properties": {
                          "Name": { "title": [ { "text": { "content": clean_title } } ] },
                          "Status": { "status": { "name": "Not started" } }
                      },
                      "children": [
                          {
                              "object": "block",
                              "type": "paragraph",
                              "paragraph": {
                                  "rich_text": [
                                      { "type": "text", "text": { "content": "Found a fresh AI breakthrough! Review this resource to craft your LinkedIn update:\n\n" } },
                                      { "type": "text", "text": { "content": "🔗 Original Source Link", "link": { "url": link } } }
                                  ]
                              }
                          }
                      ]
                  }

                  response = requests.post("https://api.notion.com/v1/pages", headers=headers, json=payload)
                  if response.status_code == 200:
                      count += 1
                      print(f"Successfully injected: {clean_title}")
                  else:
                      print(f"Error pushing entry: {response.status_code}")

          print(f"Workflow finished. Added {count} new high-value topics!")
          '
