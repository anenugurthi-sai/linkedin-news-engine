name: AI News LinkedIn Engine

on:
  schedule:
    - cron: '0 2 * * *' # Runs automatically every day at 7:30 AM IST
  workflow_dispatch: # Allows manual trigger

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Necessary Connectors
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Execute Smart Scraper, AI Writer, and Push to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c '
          import os
          import requests
          import feedparser
          import json

          NOTION_TOKEN = os.environ.get("NOTION_TOKEN")
          DATABASE_ID = os.environ.get("NOTION_DATABASE_ID")
          GEMINI_KEY = os.environ.get("GEMINI_API_KEY")

          FEEDS = [
            "https://news.google.com/rss/search?q=Salesforce+AI+Agentforce&hl=en-IN&gl=IN&ceid=IN:en",
            "https://news.google.com/rss/search?q=ChatGPT+Gemini+Anthropic+LLM+update&hl=en-IN&gl=IN&ceid=IN:en"
          ]

          def generate_linkedin_post(title, link):
              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={GEMINI_KEY}"
              headers = {"Content-Type": "application/json"}
              
              prompt = f"""
              You are a tech specialist writing a short, engaging LinkedIn post about this fresh news: "{title}".
              
              CRITICAL RULES FOR LANGUAGE & STYLE:
              1. Tone must be human, practical, and highly conversational. Write like a peer explaining it to a coworker.
              2. Absolute ban on complex corporate or AI buzzwords: NO "delve", "testament", "revolutionize", "landscape", "paradigm shift", "leverage", "furthermore", "moreover".
              3. Keep English vocabulary incredibly simple, crisp, and clean. No complex words. 
              4. Break sentences into very short lines so it is easy to read on mobile screens. Do not clump text into big paragraphs.
              5. Use only 1 or 2 relevant emojis max for the entire post. Do not put emojis on every line.

              STRUCTURE TO FOLLOW EXACTLY:
              - Line 1 (The Hook): A single punchy, bold opening sentence under 12 words that grabs attention instantly. No greetings like "Hey network".
              - Leave a blank line space.
              - Body: 2 or 3 short bullet points (using a simple dash or dot) translating what happened into everyday plain terms. Focus on "why this matters".
              - Leave a blank line space.
              - Line 3 (Call to Action): A natural, short question to get people chatting in the comments.
              - At the absolute bottom, add the link exactly as: Link to source: {link}
              
              Generate ONLY the text of the post itself. Do not include any meta-text, introductions, or formatting notes.
              """
              
              data = {
                  "contents": [{
                      "parts": [{"text": prompt}]
                  }]
              }
              
              try:
                  response = requests.post(url, headers=headers, json=data)
                  if response.status_code == 200:
                      result = response.json()
                      return result["candidates"][0]["content"]["parts"][0]["text"].strip()
              except Exception as e:
                  print(f"AI generation failed: {e}")
              return f"Fresh update on: {title}\n\nCheck out the update here:\n{link}"

          headers = {
              "Authorization": f"Bearer {NOTION_TOKEN}",
              "Content-Type": "application/json",
              "Notion-Version": "2022-06-28"
          }

          print("Starting global AI feed analysis with Voice Engine...")
          seen_titles = set()
          count = 0

          for url in FEEDS:
              feed = feedparser.parse(url)
              for entry in feed.entries[:2]: # Grabs top 2 items from each feed to keep it clean
                  title = entry.get("title", "")
                  link = entry.get("link", "")
                  
                  if title in seen_titles:
                      continue
                  seen_titles.add(title)
                  clean_title = title.split(" - ")[0]

                  print(f"Generating custom human copy for: {clean_title}")
                  custom_post_content = generate_linkedin_post(clean_title, link)

                  payload = {
                      "parent": { "database_id": DATABASE_ID },
                      "properties": {
                          "Name": { "title": [ { "text": { "content": clean_title } } ] }
                      },
                      "children": [
                          {
                              "object": "block",
                              "type": "paragraph",
                              "paragraph": {
                                  "rich_text": [
                                      { "type": "text", "text": { "content": custom_post_content } }
                                  ]
                              }
                          }
                      ]
                  }

                  response = requests.post("https://api.notion.com/v1/pages", headers=headers, json=payload)
                  if response.status_code == 200:
                      count += 1
                      print("Successfully injected into content stream!")
                  else:
                      print(f"Error: {response.status_code}")

          print(f"Workflow finished. Added {count} humanized posts to review!")
          '
